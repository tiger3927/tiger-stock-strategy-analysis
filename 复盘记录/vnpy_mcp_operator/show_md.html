<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分析报告样张 · TK 量化交易系统</title>
<style>
:root{
  --bg:#0a0e17; --bg2:#111827; --card:#151d2e; --card2:#1a2338;
  --line:#26324a; --line2:#33405e;
  --txt:#e5eaf3; --sub:#94a3b8; --dim:#64748b;
  --cyan:#22d3ee; --teal:#10b981; --amber:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7;font-size:15px}
a{color:var(--cyan);text-decoration:none}

/* 顶部条：返回目录（同窗口跳转，手机回退键回到 index.html） */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(10,14,23,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .back{font-size:13.5px;font-weight:600;color:var(--cyan);background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.35);border-radius:99px;padding:5px 16px;white-space:nowrap}
.topbar .back:hover{background:rgba(34,211,238,.22)}
.topbar .tb-title{font-size:14px;font-weight:700;color:var(--txt);letter-spacing:.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .tb-title small{display:block;font-size:10px;color:var(--dim);font-weight:400;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wrap{max-width:860px;margin:0 auto;padding:22px 20px 80px}

/* ===== Markdown 渲染样式 ===== */
.md h1{font-size:26px;font-weight:800;letter-spacing:.3px;margin:6px 0 14px;background:linear-gradient(120deg,#e2e8f0,#7dd3fc 55%,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.md h2{font-size:19px;font-weight:700;margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);color:#dbe7f5}
.md h3{font-size:16px;font-weight:600;margin:22px 0 10px;color:var(--txt)}
.md h4{font-size:14.5px;font-weight:600;margin:18px 0 8px}
.md p{margin:10px 0;font-size:14px;color:var(--sub)}
.md b,.md strong{color:var(--txt)}
.md hr{border:none;border-top:1px solid var(--line);margin:24px 0}
.md code{font-family:ui-monospace,Consolas,monospace;font-size:.86em;color:var(--cyan);background:rgba(34,211,238,.08);padding:1px 6px;border-radius:4px}
.md blockquote{border-left:3px solid var(--cyan);background:rgba(34,211,238,.05);border-radius:0 10px 10px 0;padding:10px 16px;margin:14px 0}
.md blockquote p{margin:6px 0;font-size:13.5px;color:var(--sub)}
.md ul,.md ol{margin:10px 0 10px 22px;font-size:14px;color:var(--sub)}
.md li{margin-bottom:7px}
.md li::marker{color:var(--cyan)}
.md .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:14px 0}
.md table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:420px}
.md th{background:var(--card2);color:var(--sub);font-weight:600;text-align:left;padding:10px 14px;font-size:12.5px;border-bottom:1px solid var(--line2)}
.md td{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--sub);vertical-align:top}
.md tr:last-child td{border-bottom:none}
.md td b,.md td strong{color:var(--txt)}

/* 样张列表 */
.list{margin-top:18px;display:grid;gap:12px}
.list a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:.15s}
.list a:hover{border-color:var(--cyan);transform:translateY(-2px)}
.list a .k{font-size:11px;color:var(--cyan);letter-spacing:1px;margin-bottom:4px}
.list a .t{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:4px}
.list a .d{font-size:12.5px;color:var(--dim)}
.err{color:var(--amber);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:14px 16px;margin-top:16px;font-size:14px}
footer{margin-top:40px;padding:18px 0;border-top:1px solid var(--line);color:var(--dim);font-size:12px;text-align:center}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← 返回目录</a>
  <div class="tb-title" id="tbTitle">分析报告样张<small>Token KeyTrader · 实盘 AI 报告</small></div>
</div>

<div class="wrap">
  <div id="box"></div>
  <footer>TK 量化交易系统（Token KeyTrader）· 内部资料 · 样张为历史实盘报告快照</footer>
</div>

<script>
/* ===== 极简 Markdown 渲染器（与样张文件的语法范围对齐，无外部依赖） ===== */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  var codes=[];
  s=s.replace(/`([^`]+)`/g,function(m,c){codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>');
  s=s.replace(/\u0000(\d+)\u0000/g,function(m,i){return '<code>'+codes[+i]+'</code>'});
  return s;
}
function splitRow(line){
  var t=line.trim();
  if(t.charAt(0)==='|')t=t.slice(1);
  if(t.charAt(t.length-1)==='|')t=t.slice(0,-1);
  return t.split('|').map(function(c){return c.trim()});
}
function isSepRow(line){return /^\|?[\s:|-]+\|?$/.test(line)&&line.indexOf('-')>-1}

function renderMd(md){
  var lines=md.replace(/\r\n?/g,'\n').split('\n');
  var out=[],i=0;
  while(i<lines.length){
    var raw=lines[i];
    var line=esc(raw.trim());
    if(line===''){i++;continue}
    // 水平线
    if(/^---+$/.test(line)){out.push('<hr>');i++;continue}
    // 标题
    var m=line.match(/^(#{1,4})\s+(.*)$/);
    if(m){out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>');i++;continue}
    // 表格
    if(line.indexOf('|')>-1&&i+1<lines.length&&isSepRow(lines[i+1].trim())){
      var head=splitRow(line);i+=2;
      var body=[];
      while(i<lines.length&&lines[i].trim().indexOf('|')>-1){body.push(splitRow(esc(lines[i].trim())));i++}
      out.push('<div class="tbl-wrap"><table><tr>'+
        head.map(function(c){return '<th>'+inline(c)+'</th>'}).join('')+'</tr>'+
        body.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>'}).join('')+'</tr>'}).join('')+
        '</table></div>');
      continue;
    }
    // 引用块
    if(line.indexOf('&gt;')===0){
      var buf=[];
      while(i<lines.length){
        var b=esc(lines[i].trim());
        if(b.indexOf('&gt;')!==0)break;
        var content=b.replace(/^&gt;\s?/,'');
        if(content==='')buf.push('<p></p>');else buf.push('<p>'+inline(content)+'</p>');
        i++;
      }
      out.push('<blockquote>'+buf.join('')+'</blockquote>');
      continue;
    }
    // 无序列表
    if(/^[-*]\s+/.test(line)){
      var items=[];
      while(i<lines.length&&/^[-*]\s+/.test(esc(lines[i].trim()))){
        items.push('<li>'+inline(esc(lines[i].trim()).replace(/^[-*]\s+/,''))+'</li>');i++;
      }
      out.push('<ul>'+items.join('')+'</ul>');continue;
    }
    // 有序列表
    if(/^\d+[.、]\s*/.test(line)){
      var items2=[];
      while(i<lines.length&&/^\d+[.、]\s*/.test(esc(lines[i].trim()))){
        items2.push('<li>'+inline(esc(lines[i].trim()).replace(/^\d+[.、]\s*/,''))+'</li>');i++;
      }
      out.push('<ol>'+items2.join('')+'</ol>');continue;
    }
    // 普通段落
    out.push('<p>'+inline(line)+'</p>');i++;
  }
  return out.join('\n');
}

/* ===== 加载逻辑 ===== */
var box=document.getElementById('box');
var tbTitle=document.getElementById('tbTitle');

// 样张白名单（防任意路径读取）
var SAMPLES=[
  {f:'01_美股大盘与板块和资金流向分析_20260828.md',k:'大盘 · 2026-08-28',t:'美股大盘与板块和资金流向分析',d:'方向 / risk_budget / 板块轮动预测 / 资金流向 / 风险提示'},
  {f:'02_美股做多选股结果_20260827.md',k:'做多 · 2026-08-27',t:'美股做多选股结果',d:'候选池漏斗 / 评分卡 / 反方审查 / 观察清单'},
  {f:'03_美股做空选股结果_20260828.md',k:'做空 · 2026-08-28',t:'美股做空选股结果',d:'做空候选 / 反方审查 / 拒绝原因（本期输出 0 只）'},
  {f:'04_策略分析_MARTIN-GOLD_20260829.md',k:'策略 · 2026-08-29',t:'策略分析 · MARTIN-GOLD',d:'五段式理由 / 参数修改留痕 / 价位与仓位参数'}
];

var f=new URLSearchParams(location.search).get('f');

if(!f){
  document.title='分析报告样张 · 列表';
  box.innerHTML='<h1 style="font-size:24px;font-weight:800">分析报告样张</h1>'+
    '<p style="color:var(--dim);font-size:13.5px;margin:8px 0">实盘 AI 报告快照（vnpy_mcp 拉取后美化排版），点击任一卡片查看全文。</p>'+
    '<div class="list">'+SAMPLES.map(function(s){
      return '<a href="show_md.html?f='+encodeURIComponent(s.f)+'"><div class="k">'+s.k+'</div><div class="t">'+s.t+'</div><div class="d">'+s.d+'</div></a>';
    }).join('')+'</div>';
}else{
  var hit=SAMPLES.filter(function(s){return s.f===f})[0];
  if(!hit){
    box.innerHTML='<div class="err">未找到该样张（文件名不在白名单内）。<br><br><a href="show_md.html">← 返回样张列表</a></div>';
  }else{
    fetch('分析报告样张/'+encodeURIComponent(f))
      .then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
      .then(function(text){
        var title=hit.t;
        var h1m=text.match(/^#\s+(.+)$/m);
        if(h1m)title=h1m[1];
        document.title=title+' · TK 量化交易系统';
        tbTitle.innerHTML=title+'<small>Token KeyTrader · 实盘 AI 报告样张</small>';
        box.innerHTML='<div class="md">'+renderMd(text)+'</div>';
      })
      .catch(function(e){
        box.innerHTML='<div class="err">样张加载失败（'+e.message+'）<br><br>请确认通过 HTTP 服务访问本页（file:// 方式下浏览器禁止 fetch 本地文件），或 <a href="show_md.html">返回样张列表</a>。</div>';
      });
  }
}
</script>
</body>
</html>
